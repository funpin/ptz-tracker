[build-system]
requires = ["setuptools>=77", "wheel"]  # license = SPDX-строка
build-backend = "setuptools.build_meta"

[project]
name = "ptztracker"
dynamic = ["version"]  # единый номер — ptztracker.__version__ (docs/RELEASING.md)
description = "Управление и автослежение для PTZ-камер Panasonic AW-HE42"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "funpin" }]
dependencies = [
    "PySide6>=6.7",
    "av>=12",
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.9",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
build = ["pyinstaller>=6.6"]

[project.scripts]
ptztracker = "ptztracker.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ptztracker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptztracker = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: тесты в реальном времени на симуляторе (минуты); быстрый цикл: -m \"not slow\""]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
ignore = ["B905"]  # zip без strict: попарные проходы по соседним элементам — намеренно разной длины
