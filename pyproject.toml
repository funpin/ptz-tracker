[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptztracker"
version = "0.1.0"
description = "Управление и автослежение для PTZ-камер Panasonic AW-HE42"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.7",
    "av>=12",
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.9",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.6"]

[project.scripts]
ptztracker = "ptztracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptztracker = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: долгие тесты (сеть/таймауты)"]
