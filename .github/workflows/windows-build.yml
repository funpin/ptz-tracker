name: Build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Действия закреплены коммитом: подвижный тег отдал бы сборку тому, кто перепишет тег.
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev,build]
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests (fast)
        run: python -m pytest -q -m "not slow"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: pyinstaller packaging/ptztracker.spec --noconfirm
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PTZTracker/* -DestinationPath dist/PTZTracker-win64.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PTZTracker-win64
          path: dist/PTZTracker-win64.zip
