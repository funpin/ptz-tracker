name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev,build]
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: pyinstaller packaging/ptztracker.spec --noconfirm
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PTZTracker/* -DestinationPath dist/PTZTracker-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PTZTracker-win64
          path: dist/PTZTracker-win64.zip
